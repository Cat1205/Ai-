<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 垃圾分類助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scanning-line {
            height: 3px;
            background: rgba(34, 197, 94, 0.8);
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 1.5s linear infinite;
            box-shadow: 0 0 15px 5px rgba(34, 197, 94, 0.5);
            z-index: 20;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .pulse-loader {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .preview-active {
            filter: brightness(0.7);
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-bg {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex flex-col text-slate-800">

    <!-- 標題欄 -->
    <header class="bg-green-600 text-white p-5 shadow-lg text-center sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-wider">AI 垃圾分類助手</h1>
        <p class="text-xs opacity-90 mt-1">AI辨識模式 • 繁體中文版 (需連網路)</p>
    </header>

    <main class="flex-grow flex flex-col p-4 gap-4 max-w-md mx-auto w-full">
        
        <!-- 相機顯示區塊 -->
        <div id="cameraContainer" class="relative bg-black rounded-3xl overflow-hidden aspect-[3/4] shadow-2xl border-4 border-white transition-all duration-300">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- 拍照瞬間的凍結畫面 -->
            <img id="frozenImg" class="absolute inset-0 w-full h-full object-cover hidden z-10">

            <!-- 載入中動畫層 -->
            <div id="loadingOverlay" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/40 backdrop-blur-[2px]">
                <div class="pulse-loader mb-4"></div>
                <span class="text-white font-bold tracking-widest text-lg">辨識中...</span>
            </div>
            
            <!-- 掃描線 -->
            <div id="scannerOverlay" class="hidden absolute inset-0 pointer-events-none z-20">
                <div class="scanning-line"></div>
                <div class="absolute inset-0 border-[30px] border-black/20"></div>
            </div>

            <!-- 提示字樣 -->
            <div id="hintText" class="absolute bottom-6 left-0 right-0 text-center z-20">
                <span class="bg-black/60 text-white text-xs px-4 py-2 rounded-full backdrop-blur-sm border border-white/20">
                    對準物品後點擊下方按鈕
                </span>
            </div>
        </div>

        <!-- 操作按鈕區 -->
        <div class="flex gap-2 px-2">
            <button id="captureBtn" class="flex-[3] bg-green-600 hover:bg-green-700 disabled:bg-slate-400 text-white font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95 text-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                立即辨識(點擊開始)
            </button>
            <div class="flex flex-col gap-2 flex-1">
                <button id="torchBtn" class="flex-1 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 shadow-sm">
                    <svg id="torchIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 3 11 3-11h-6Z"/><path d="M12 13v9"/><path d="M10 18h4"/></svg>
                    <span class="text-[10px] mt-1">手電筒</span>
                </button>
                <button onclick="toggleGuide(true)" class="flex-1 bg-white border-2 border-green-600 text-green-600 font-bold rounded-2xl flex flex-col items-center justify-center transition-all active:scale-95 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <span class="text-[10px] mt-1">分類指南</span>
                </button>
            </div>
        </div>

        <!-- 辨識結果 -->
        <div id="resultCard" class="hidden bg-white p-6 rounded-3xl shadow-xl border-t-8 border-green-500 mx-2 mb-8 animate-fade-in">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">辨識結果</span>
                    <h2 id="trashCategory" class="text-2xl font-black text-green-700">--</h2>
                </div>
                <div class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </div>
            </div>
            <p id="trashDescription" class="text-slate-600 text-sm leading-relaxed mb-4 font-medium"></p>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <p class="text-xs text-slate-900 font-bold mb-1 italic">📌 處理建議</p>
                <p id="actionAdvice" class="text-xs text-slate-500 leading-normal"></p>
            </div>
            <button onclick="resetUI()" class="mt-4 w-full py-3 text-sm text-green-600 font-bold border border-green-200 rounded-xl hover:bg-green-50 transition-colors">再次拍攝</button>
        </div>

        <!-- 錯誤 -->
        <div id="errorMessage" class="hidden mx-2 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-2xl relative flex items-start gap-3">
            <span id="errorText" class="text-xs font-medium">發生錯誤</span>
        </div>
    </main>

    <!-- 分類指南 彈出層 -->
    <div id="guideModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="bg-green-600 p-5 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">垃圾分類參考表</h3>
                <button onclick="toggleGuide(false)" class="text-white/80 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div class="border-l-4 border-blue-500 pl-3">
                    <h4 class="font-bold text-blue-600">資源回收</h4>
                    <p class="text-xs text-slate-500 mt-1">紙類、寶特瓶、鋁罐、塑膠盒、玻璃瓶、廢乾電池、舊衣。</p>
                </div>
                <div class="border-l-4 border-slate-400 pl-3">
                    <h4 class="font-bold text-slate-600">一般垃圾</h4>
                    <p class="text-xs text-slate-500 mt-1">衛生紙、髒污紙張、沾有油漬的便當盒、吸管、橡皮筋。</p>
                </div>
                <div class="border-l-4 border-amber-600 pl-3">
                    <h4 class="font-bold text-amber-700">廚餘</h4>
                    <p class="text-xs text-slate-500 mt-1">剩菜剩飯、果皮、過期食物、咖啡渣（肥份廚餘）。</p>
                </div>
                <div class="border-l-4 border-red-600 pl-3">
                    <h4 class="font-bold text-red-600">有害/大型垃圾</h4>
                    <p class="text-xs text-slate-500 mt-1">日光燈管、殺蟲劑、瓦斯罐、廢家電、大型家具。</p>
                </div>
            </div>
            <button onclick="toggleGuide(false)" class="m-5 py-3 bg-slate-100 text-slate-600 font-bold rounded-xl">關閉指南</button>
        </div>
    </div>

    <footer class="p-6 text-center text-slate-400 text-[10px]">
        Gemini 2.5 Flash 智慧影像辨識 • 繁體中文版本
    </footer>

    <script>
        const apiKey = ""; 
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const frozenImg = document.getElementById('frozenImg');
        const captureBtn = document.getElementById('captureBtn');
        const torchBtn = document.getElementById('torchBtn');
        const torchIcon = document.getElementById('torchIcon');
        const resultCard = document.getElementById('resultCard');
        const scannerOverlay = document.getElementById('scannerOverlay');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const trashCategory = document.getElementById('trashCategory');
        const trashDescription = document.getElementById('trashDescription');
        const actionAdvice = document.getElementById('actionAdvice');
        const errorMessage = document.getElementById('errorMessage');
        const guideModal = document.getElementById('guideModal');

        let stream = null;
        let isTorchOn = false;

        async function initCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                } catch (e) {
                    showError("無法啟動相機。請確保已允許相機權限且裝置有後置鏡頭。");
                }
            }
        }

        async function toggleTorch() {
            if (!stream) return;
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();

            if (!capabilities.torch) {
                showError("此裝置或瀏覽器不支援手電筒功能。");
                return;
            }

            try {
                isTorchOn = !isTorchOn;
                await track.applyConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
                
                if (isTorchOn) {
                    torchBtn.classList.add('bg-yellow-400', 'border-yellow-500', 'text-white');
                    torchBtn.classList.remove('bg-white', 'text-slate-600');
                } else {
                    torchBtn.classList.remove('bg-yellow-400', 'border-yellow-500', 'text-white');
                    torchBtn.classList.add('bg-white', 'text-slate-600');
                }
            } catch (e) {
                showError("手電筒控制失敗。");
            }
        }

        function toggleGuide(show) {
            guideModal.classList.toggle('hidden', !show);
        }

        function showError(msg) {
            document.getElementById('errorText').innerText = msg;
            errorMessage.classList.remove('hidden');
            setTimeout(() => errorMessage.classList.add('hidden'), 5000);
        }

        function resetUI() {
            resultCard.classList.add('hidden');
            frozenImg.classList.add('hidden');
            loadingOverlay.classList.add('hidden');
            scannerOverlay.classList.add('hidden');
            video.classList.remove('preview-active');
            captureBtn.disabled = false;
        }

        async function analyzeImage(base64Image) {
            const prompt = "你是一個台灣垃圾分類專家。請判斷照片中的物品名稱並分類（一般垃圾、資源回收、廚餘、有害垃圾）。請完全使用繁體中文。回傳格式必須是 JSON: {\"category\": \"分類\", \"item\": \"名稱\", \"reason\": \"原因\", \"advice\": \"建議\"}";
            
            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: { 
                    responseMimeType: "application/json",
                    temperature: 0.1 
                }
            };

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) throw new Error('API ERROR');
            const data = await response.json();
            if (!data.candidates || data.candidates.length === 0) throw new Error('NO RESULT');
            return JSON.parse(data.candidates[0].content.parts[0].text);
        }

        captureBtn.onclick = async () => {
            if (!video.videoWidth) return;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const capturedData = canvas.toDataURL('image/jpeg', 0.7);
            const base64Data = capturedData.split(',')[1];
            
            frozenImg.src = capturedData;
            frozenImg.classList.remove('hidden');
            video.classList.add('preview-active');

            resultCard.classList.add('hidden');
            scannerOverlay.classList.remove('hidden');
            loadingOverlay.classList.remove('hidden');
            captureBtn.disabled = true;

            try {
                const result = await analyzeImage(base64Data);

                trashCategory.innerText = result.category;
                trashDescription.innerText = `這看起來是「${result.item}」。${result.reason}`;
                actionAdvice.innerText = result.advice;

                const colors = {
                    '一般垃圾': 'border-slate-500',
                    '資源回收': 'border-blue-500',
                    '廚餘': 'border-amber-600',
                    '有害垃圾': 'border-red-600'
                };
                resultCard.className = `bg-white p-6 rounded-3xl shadow-xl border-t-8 ${colors[result.category] || 'border-green-500'} mx-2 mb-8 animate-fade-in`;
                
                resultCard.classList.remove('hidden');
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

            } catch (err) {
                console.error(err);
                showError("辨識失敗，可能是網路不穩或圖片不清晰。請再試一次。");
                resetUI();
            } finally {
                loadingOverlay.classList.add('hidden');
                scannerOverlay.classList.add('hidden');
                captureBtn.disabled = false;
            }
        };

        torchBtn.onclick = toggleTorch;

        window.onload = initCamera;
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') initCamera();
        });
    </script>
</body>
</html>
